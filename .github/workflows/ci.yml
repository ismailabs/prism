name: Financial integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:db
      - run: npm run test:platform-db
      - run: npm run test:foundations-db
      - run: npm run test:period-db
      - name: Install PostgREST test binary
        run: |
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz -o /tmp/postgrest.tar.xz
          tar -xf /tmp/postgrest.tar.xz -C /tmp
          echo "PGRST_TEST_BINARY=/tmp/postgrest" >> "$GITHUB_ENV"
      - run: npm run test:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:responsive
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: fixture-anon-key
