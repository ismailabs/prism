name: Financial integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRISM_LOCAL_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned official Supabase CLI with digest verification
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.119.0/supabase_2.119.0_linux_amd64.tar.gz -o /tmp/prism-supabase-cli.tar.gz
          echo 'bf1c3ae93be98533eb8a3105dbf4564bd0b2d9dc24690d8a920f980ef975c1b4  /tmp/prism-supabase-cli.tar.gz' | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/prism-supabase-bin"
          tar -xzf /tmp/prism-supabase-cli.tar.gz -C "$RUNNER_TEMP/prism-supabase-bin" supabase
          echo "$RUNNER_TEMP/prism-supabase-bin" >> "$GITHUB_PATH"
      - name: Prepare synthetic local Supabase schema and stronger local Auth policy
        run: node scripts/local-supabase-ci.mjs prepare
      - name: Start and verify actual loopback-only local Supabase containers
        run: node scripts/local-supabase-ci.mjs start
      - name: Accept real local Auth, SMTP capture, MFA, recovery and A/B RLS
        run: node scripts/local-supabase-acceptance.mjs
      - name: Stop only the isolated synthetic stack
        if: always()
        run: node scripts/local-supabase-ci.mjs stop
      - name: Preserve redacted local-stack receipts in required logs
        if: always()
        run: |
          for receipt in artifacts/public-launch/local-supabase-{chain,runtime,acceptance}.json; do
            if [ -f "$receipt" ]; then cat "$receipt"; fi
          done
      - name: Preserve optional redacted local-stack receipt archive
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: prism-local-supabase-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            artifacts/public-launch/local-supabase-chain.json
            artifacts/public-launch/local-supabase-runtime.json
            artifacts/public-launch/local-supabase-acceptance.json
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Prepare local-only verification logs
        run: |
          mkdir -p artifacts/ci
          node --input-type=module -e 'for (const name of ["PRISM_E2E_BASE_URL", "PRISM_E2E_STORAGE_STATE"]) { if (process.env[name]) throw new Error("Hosted browser opt-in is forbidden in this fixture-only job"); }' 2>&1 | tee artifacts/ci/local-only.log
          git rev-parse HEAD | tee artifacts/ci/commit.log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 24
          cache: npm
      # Bash pipefail preserves each failing command's exit status through tee.
      - run: npm ci 2>&1 | tee artifacts/ci/install.log
      - run: npm run typecheck 2>&1 | tee artifacts/ci/typecheck.log
      - run: node scripts/mandatory-mfa-db-test.mjs 2>&1 | tee artifacts/ci/mandatory-mfa.log
      - run: npm run lint 2>&1 | tee artifacts/ci/lint.log
      - run: npm run test 2>&1 | tee artifacts/ci/unit.log
      - run: npm run test:db 2>&1 | tee artifacts/ci/finance-db.log
      - run: node scripts/transaction-precision-repair-test.mjs 2>&1 | tee artifacts/ci/transaction-precision-repair.log
      - run: npm run test:platform-db 2>&1 | tee artifacts/ci/platform-db.log
      - run: npm run test:foundations-db 2>&1 | tee artifacts/ci/foundations-db.log
      - run: npm run test:period-db 2>&1 | tee artifacts/ci/period-db.log
      - run: npm run test:ledger-db 2>&1 | tee artifacts/ci/ledger-db.log
      - run: npm run ledger:dry-run 2>&1 | tee artifacts/ci/ledger-dry-run.log
      - run: node scripts/phase2-review-probes.mjs 2>&1 | tee artifacts/ci/phase2-review.log
      - run: npm run test:actions-review 2>&1 | tee artifacts/ci/actions-review.log
      - run: npm run test:actions-db 2>&1 | tee artifacts/ci/actions-db.log
      - run: npm run test:goal-actions-db 2>&1 | tee artifacts/ci/goal-actions-db.log
      - run: npm run test:planning-db 2>&1 | tee artifacts/ci/planning-db.log
      - run: npm run test:integration-db 2>&1 | tee artifacts/ci/integration-db.log
      - run: npm run test:integration-review 2>&1 | tee artifacts/ci/integration-review.log
      - run: npm run test:deletion-security 2>&1 | tee artifacts/ci/deletion-security.log
      - name: Install PostgREST test binary
        run: |
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v16.4/postgrest-v16.4-linux-static-x86-64.tar.xz -o /tmp/postgrest.tar.xz
          tar -xf /tmp/postgrest.tar.xz -C /tmp
          echo "PGRST_TEST_BINARY=/tmp/postgrest" >> "$GITHUB_ENV"
      - run: npm run test:actions-native 2>&1 | tee artifacts/ci/actions-native.log
      - run: npm run test:intelligence-db 2>&1 | tee artifacts/ci/intelligence-db.log
      - run: npm run test:intelligence-native 2>&1 | tee artifacts/ci/intelligence-native.log
      - run: npm run test:intelligence-review 2>&1 | tee artifacts/ci/intelligence-review.log
      - run: npm run test:postgres 2>&1 | tee artifacts/ci/native-http.log
      - run: npx playwright install --with-deps chromium 2>&1 | tee artifacts/ci/browser-install.log
      - run: npm run test:ledger-preview 2>&1 | tee artifacts/ci/ledger-preview.log
      - run: npm run test:e2e 2>&1 | tee artifacts/ci/browser.log
      - run: npm run test:auth-security 2>&1 | tee artifacts/ci/auth-security.log
      - run: npm run test:pwa-review 2>&1 | tee artifacts/ci/pwa-review.log
      - run: npm run test:release-package 2>&1 | tee artifacts/ci/source-package.log
      - run: npm run test:pwa 2>&1 | tee artifacts/ci/pwa-browser.log
      - run: node scripts/phase7-restore-test.mjs 2>&1 | tee artifacts/ci/restore.log
      - run: npm run test:localization 2>&1 | tee artifacts/ci/localization.log
      - run: npm run test:responsive 2>&1 | tee artifacts/ci/responsive.log
      - run: npm run build 2>&1 | tee artifacts/ci/build.log
        env:
          VITE_SUPABASE_URL: https://fixture.supabase.co
          VITE_SUPABASE_ANON_KEY: fixture-anon-key
      # Only this local fixture job may upload traces. Never reuse this allowlist
      # for hosted authenticated tests or add env files, database dirs or state.
      - name: Preserve fixture receipts in Actions logs, including failures
        if: always()
        run: node scripts/ci-evidence-log-fallback.mjs
      - name: Preserve optional synthetic binary evidence archive
        if: always()
        # Tests and the required log receipts still fail normally. Artifact
        # storage is capped at RM0; an unavailable binary copy is disclosed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: prism-local-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            artifacts/security/mandatory-mfa-db.json
            artifacts/security/enrollment-mail-*.png
            artifacts/ci/*.log
            artifacts/integration/migration-verification.json
            artifacts/integration/adversarial-rollover.json
            artifacts/integration/budget-*.png
            artifacts/integration/accounting-*.png
            artifacts/phase2/final-review-probes.json
            artifacts/phase2/reconciliation.json
            artifacts/phase5/native-verification.json
            artifacts/phase5/*-review.json
            artifacts/phase5/*.png
            artifacts/responsive-checks.json
            artifacts/phase7/*-review.json
            artifacts/phase7/pwa-cache-inventory.json
            artifacts/phase7/restore-rehearsal.json
            artifacts/phase7/localization-literals.json
            artifacts/phase7/*.png
            artifacts/phase7/pwa-results-*/
            artifacts/qa-failure.png
            artifacts/calm-precision/screens/*.png
            artifacts/calm-precision/screens/a11y-*.json
            artifacts/public-launch/large-report.json
            test-results/
            playwright-report/
